name: Build PureTidings Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
          echo "Using Android SDK at: $ANDROID_HOME"
          echo "Using Android NDK at: $NDK_PATH"
          echo "Using Toolchain at: $TOOLCHAIN"

          # Create symlinks for legacy toolchain names expected by OpenSSL and build scripts
          for arch in aarch64-linux-android arm-linux-androideabi armv7-linux-androideabi x86_64-linux-android i686-linux-android; do
            for tool in ar as nm objcopy objdump ranlib readelf strip; do
              sudo ln -sf llvm-$tool "$TOOLCHAIN/bin/${arch}-${tool}" 2>/dev/null || true
            done
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm install

      - name: Initialize Tauri Android (if not present)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Initializing Android project structure..."
            npx tauri android init --ci
          fi
          if [ -f "src-tauri/gen/android/app/src/main/AndroidManifest.xml" ]; then
            if ! grep -q "POST_NOTIFICATIONS" src-tauri/gen/android/app/src/main/AndroidManifest.xml; then
              echo "Injecting POST_NOTIFICATIONS permission into AndroidManifest.xml..."
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' src-tauri/gen/android/app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Copy PureTidings Android Icons
        run: |
          echo "Copying PureTidings icons to Android res directory..."
          mkdir -p src-tauri/gen/android/app/src/main/res
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      - name: Generate Release Keystore and Signing Config
        run: |
          mkdir -p src-tauri/gen/android/app
          keytool -genkeypair -v \
            -keystore src-tauri/gen/android/release.keystore \
            -alias puretidings \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass puretidings123 \
            -keypass puretidings123 \
            -dname "CN=PureTidings, OU=Mobile, O=PureTidings, L=Berlin, S=Berlin, C=DE"

          cp src-tauri/gen/android/release.keystore src-tauri/gen/android/app/release.keystore

          cat <<EOF > src-tauri/gen/android/keystore.properties
          password=puretidings123
          keyAlias=puretidings
          storeFile=release.keystore
          EOF

      - name: Build Android APK (Release)
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          export NDK_HOME=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          export TOOLCHAIN=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export PATH=$TOOLCHAIN/bin:$PATH
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar
          export RANLIB_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ranlib
          npx tauri android build --apk --target aarch64
        env:
          AWS_LC_SYS_PREBUILT_NASM: "1"

      - name: Locate and Prepare APK
        run: |
          mkdir -p build-artifacts
          echo "Searching for generated APKs..."
          find src-tauri/gen/android -name "*.apk" -ls

          APK_FILE=$(find src-tauri/gen/android -name "*release*.apk" -o -name "*unsigned*.apk" -o -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" build-artifacts/PureTidings_aarch64.apk

            # Verify or apply APK signature using apksigner
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              echo "Using apksigner at: $APKSIGNER"
              if ! "$APKSIGNER" verify build-artifacts/PureTidings_aarch64.apk 2>/dev/null; then
                echo "Signing APK with apksigner..."
                "$APKSIGNER" sign --ks src-tauri/gen/android/release.keystore --ks-pass pass:puretidings123 --ks-key-alias puretidings build-artifacts/PureTidings_aarch64.apk
              fi
              echo "Verifying final APK signature..."
              "$APKSIGNER" verify -v build-artifacts/PureTidings_aarch64.apk
            fi
          else
            echo "ERROR: No APK found!"
            exit 1
          fi
          ls -la build-artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureTidings-Android-APK
          path: build-artifacts/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
          if [ -z "$TAG_NAME" ]; then
            APP_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG_NAME="v$APP_VER"
          fi
          echo "Target release tag: $TAG_NAME"

          echo "Waiting for Desktop release $TAG_NAME to be published..."
          for i in {1..60}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Published release $TAG_NAME is available!"
              break
            fi
            echo "Release not published yet (status $HTTP_STATUS, attempt $i/60). Waiting 10 seconds..."
            sleep 10
          done

          echo "Waiting 30 seconds for desktop asset streams to stabilize before attaching APK..."
          sleep 30

          echo "Uploading PureTidings_aarch64.apk to GitHub Release $TAG_NAME..."
          for attempt in {1..5}; do
            if gh release upload "$TAG_NAME" build-artifacts/PureTidings_aarch64.apk --clobber; then
              echo "APK upload succeeded on attempt $attempt."
              break
            fi
            echo "Upload failed on attempt $attempt, retrying in 15 seconds..."
            sleep 15
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
