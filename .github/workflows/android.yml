name: Build PureTidings Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android SDK at: $ANDROID_HOME"
          echo "Using Android NDK at: $NDK_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm install

      - name: Initialize Tauri Android (if not present)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Initializing Android project structure..."
            npx tauri android init --ci
          fi

      - name: Build Android APK (Release)
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          export NDK_HOME=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          echo "Using NDK at: $NDK_HOME"
          npx tauri android build --apk --target aarch64
        env:
          AWS_LC_SYS_PREBUILT_NASM: "1"

      - name: Locate and Prepare APK
        run: |
          mkdir -p build-artifacts
          find src-tauri/gen/android -name "*release*.apk" -o -name "*unsigned*.apk" -o -name "*.apk" | head -n 5
          for apk in $(find src-tauri/gen/android -name "*.apk"); do
            cp "$apk" build-artifacts/PureTidings_aarch64.apk
            break
          done
          ls -la build-artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureTidings-Android-APK
          path: build-artifacts/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
