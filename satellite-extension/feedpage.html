<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>All Posts - PureTidings</title>
    <link rel="icon" type="image/png" sizes="16x16" href="16.png">
    <link rel="icon" type="image/png" sizes="48x48" href="48.png">
    <link rel="icon" type="image/png" sizes="128x128" href="128.png">
    <link rel="stylesheet" href="feedpage.css">
    <link rel="stylesheet" href="dark-theme.css">
    <script src="theme-loader.js"></script>
</head>
<div class="page-layout">
    <aside class="sidebar">
      <h1 class="sidebar-title">PureTidings</h1>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="#" id="nav-all" class="active">All Posts</a></li>
          <li><a href="#" id="nav-unread">Unread Posts</a></li>
          <li><a href="#" id="nav-favorites">Favorites</a></li>
          <li><a href="#" id="nav-keywords">Keyword Matches</a></li>
          <li><a href="#" id="nav-summary">Summary Cart</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-top">
          <a href="#" id="sidebar-settings-btn" title="Settings"></a>
        </div>
        <input type="search" id="search-box" placeholder="Search... (+ AND, , OR, - NOT)" title="Example: Apple +Macbook -iPhone">
      </div>
    </aside>

    <div class="main-content">
      <header class="main-header">
        <h2 id="page-title">All Posts</h2> 
        <div id="summary-toolbar" class="hidden">
          <div class="summary-toolbar-section">
            <select id="summary-date-filter">
              <option value="all">All Dates</option>
              <option value="today">Today</option>
              <option value="7days">Last 7 Days</option>
              <option value="30days">Last 30 Days</option>
              <option value="custom">Custom Range...</option>
            </select>
            <div id="custom-range-container" class="hidden">
              <input type="date" id="filter-date-from" title="Start Date">
              <input type="time" id="filter-time-from" title="Start Time">
              <span class="range-separator">to</span>
              <input type="date" id="filter-date-to" title="End Date">
              <input type="time" id="filter-time-to" title="End Time">
            </div>
          </div>
          
          <div class="summary-toolbar-section">
            <select id="export-format" title="Export Format">
              <option value="txt">TXT</option>
              <option value="markdown">Markdown</option>
              <option value="html">HTML</option>
            </select>
            <button id="copy-summary-btn" class="secondary-btn">Copy</button>
            <button id="download-summary-btn" class="secondary-btn">Save</button>
          </div>

          <div class="summary-toolbar-section">
            <button id="generate-ai-report-btn" class="secondary-btn hidden">AI Report</button>            <button id="full-view-summary-btn" class="secondary-btn">Full Report View</button>
            <button id="clear-summary-btn" class="delete-btn">Clear All</button>
          </div>
          <p id="copy-status" class="status-message-inline"></p>
        </div>
      </header>
      <main id="main-area" style="padding: 0;">
        <div id="ai-report-container" class="hidden" style="margin-bottom: 20px; padding: 20px; background: var(--bg-color-secondary); border-radius: 8px; border: 1px solid var(--border-color);">
            <div class="ai-report-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3 style="margin: 0;">AI Generated Report</h3>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <select id="export-ai-format" title="Export Format" style="padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color);">
                      <option value="txt">TXT</option>
                      <option value="markdown">Markdown</option>
                      <option value="html">HTML</option>
                    </select>
                    <button id="copy-ai-report-btn" class="secondary-btn">Copy</button>
                    <button id="download-ai-report-btn" class="secondary-btn">Save</button>
                    <button id="close-ai-report-btn" class="secondary-btn" style="margin-left: 10px;">Close</button>
                </div>
            </div>
            
            <!-- Prompt Editor Section -->
            <div id="ai-prompt-editor-section" style="margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="ai-custom-prompt-val" style="font-size: 0.9em; font-weight: bold; color: var(--text-color);">Customize Prompt for this Summary:</label>
                    <div style="display: flex; gap: 10px; align-items: flex-end;">
                        <textarea id="ai-custom-prompt-val" rows="2" style="flex: 1; padding: 8px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; font-family: inherit; font-size: 13px; resize: vertical; outline: none;"></textarea>
                        <button id="ai-generate-with-prompt-btn" class="secondary-btn" style="height: 38px; padding: 0 15px; font-weight: bold; background: #3c5c8b; color: white; border: none; border-radius: 4px; cursor: pointer;">Generate 🤖</button>
                    </div>
                </div>
            </div>

            <div id="ai-report-content" class="ai-report-body" style="line-height: 1.6; font-size: 1.1em; white-space: pre-wrap;"></div>
        </div>
        <div id="loading-spinner"></div>
        <p id="empty-message" class="hidden">No feeds configured or no posts found.</p>
        <div id="all-feeds-container">
            <!-- Feed sections will be inserted here via JS -->
        </div>
      </main>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="feed-tree-utils.js"></script>
  <script src="Readability.js"></script>
  <script src="feedpage.js"></script>
  <button id="scroll-to-top" class="hidden" title="Go to top">&uarr;</button>
</body>
</html>
