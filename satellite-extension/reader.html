<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PureTidings Reader</title>
    <link rel="stylesheet" href="dark-theme.css">
    <script src="satellite-bridge.js"></script>
    <style>
      body {
        margin: 0; padding: 40px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1e1e1e; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center;
      }
      .card {
        background: #2a2a2a; padding: 32px 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); max-width: 480px;
      }
      .btn {
        margin-top: 18px; padding: 10px 22px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer;
      }
    </style>
</head>
<body>
  <div class="card">
    <img src="128.png" style="width: 54px; height: 54px; border-radius: 10px; margin-bottom: 12px;">
    <h2 style="margin: 0 0 8px 0; font-size: 18px;">PureTidings Desktop Reader</h2>
    <p style="margin: 0; font-size: 14px; opacity: 0.85; line-height: 1.5;">Articles and AI Summaries are processed directly inside the PureTidings Desktop Application.</p>
    <p id="status-text" style="margin-top: 14px; font-size: 13px; color: #8ab4f8;">Opening in PureTidings Desktop...</p>
    <button id="open-btn" class="btn" style="display: none;">Open in Desktop App</button>
  </div>
  <script src="reader.js"></script>
</body>
</html>
