<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PureTidings Desktop - Settings</title>
  <link rel="stylesheet" href="dark-theme.css">
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      background: var(--bg-color, #18181b);
      color: var(--text-color, #f4f4f5);
    }
    .bridge-card {
      background: var(--sidebar-bg, #27272a);
      border: 1px solid var(--border-color, #3f3f46);
      border-radius: 12px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .bridge-card img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .bridge-card h2 {
      margin: 0 0 10px 0;
      font-size: 20px;
      font-weight: 700;
    }
    .bridge-card p {
      margin: 0 0 24px 0;
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.5;
    }
    .btn-launch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-launch:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="bridge-card">
    <img src="128.png" alt="PureTidings">
    <h2>PureTidings Desktop</h2>
    <p id="bridge-status">Einstellungen werden in der PureTidings Desktop App geöffnet...</p>
    <a href="puretidings://open" id="launch-btn" class="btn-launch">🚀 Desktop App öffnen</a>
  </div>
  <script src="satellite-bridge.js"></script>
  <script src="options.js"></script>
</body>
</html>
